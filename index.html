<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>The Cave</title><link rel="stylesheet" href="style.css"></head>
<body><canvas id="world" aria-label="Cave canvas. Click objects to collect them. Left drag to paint, middle drag or two-finger drag to explore."></canvas>
<header><div class="header-actions"><button id="resetOpen">start fresh ↻</button><button id="exportOpen">save a picture ↗</button></div></header>
<div id="toast" role="status" aria-live="polite"></div><div id="cursor"></div>
<section class="dock" aria-label="Your pocket"><div id="palette"></div><div id="brushTools" hidden><button data-size="8" class="active" title="Small brush (1)">•</button><button data-size="20" title="Medium brush (2)">●</button><button data-size="40" title="Large brush (3)">⬤</button><button id="eraser" title="Eraser (E)">erase</button></div><button id="hand" title="Move with one finger (H)" aria-label="Move with one finger">move</button><button id="undo" aria-label="Undo" title="Undo (Ctrl+Z)">↶</button><button id="redo" aria-label="Redo" title="Redo (Ctrl+Shift+Z)">↷</button></section>
<div id="movePad" role="group" aria-label="Thumb joystick: hold and slide to move while drawing"><span id="moveKnob" aria-hidden="true">✥</span></div>
<footer><span id="saveState">saved here</span><button id="home">back to the beginning</button></footer>
<dialog id="exportDialog"><form method="dialog"><button class="close" aria-label="Close">×</button></form><h2>A bit of the cave.</h2><label>Save<select id="exportArea"><option value="view">What I can see</option><option value="painting">Everywhere I painted</option></select></label><button id="download">Download PNG ↗</button><small>Large pictures fit within 4096 × 4096 pixels.</small></dialog>
<dialog id="resetDialog"><h2>A fresh cave?</h2><p>This deletes your drawing, collected tools, discoveries, and undo history from this browser. You’ll begin in a newly generated cave.</p><p>Save a picture first if you want to keep your artwork.</p><div class="reset-actions"><button id="resetCancel" autofocus>Keep exploring</button><button id="resetConfirm">Delete & start fresh</button></div></dialog>
<script src="cave-world.js"></script><script src="app.js"></script></body></html>
