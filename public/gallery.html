<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f8f7f2">
  <title>The Gallery Wall</title>
  <link rel="stylesheet" href="gallery.css">
</head>
<body>
  <header class="top">
    <a class="back" href="./">← Back into the world</a>
    <h1>The Gallery Wall</h1>
    <p id="summary">Pictures people painted in Endless Canvas.</p>
  </header>
  <main id="wall" aria-live="polite"></main>
  <p id="empty" hidden>Nothing pinned yet. Paint something, then press the save button and pin it here.</p>

  <dialog id="closer">
    <button class="close" aria-label="Close">×</button>
    <img id="closerImg" alt="">
    <div class="closer-text">
      <h2 id="closerTitle"></h2>
      <p id="closerMeta"></p>
      <div class="row">
        <a id="closerDownload" download>Download</a>
        <button id="closerDelete" hidden>Take it down</button>
      </div>
    </div>
  </dialog>
  <script type="module" src="js/gallery.js"></script>
</body>
</html>
