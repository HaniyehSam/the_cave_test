<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f8f7f2">
  <title>Endless Canvas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="world" tabindex="0" aria-label="An endless canvas to explore and paint. Draw with one finger, mouse or pen. Move with two fingers, the hand tool, space, or scrolling."></canvas>

  <header id="place" aria-live="polite"><span id="placeName"></span><span id="placeFinds"></span></header>

  <div class="actions">
    <button id="journalBtn" title="Credits (J)" aria-label="Open credits">
      <svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3zM5 17a3 3 0 0 1 3-3h11M9 8h6"/></svg>
    </button>
    <a id="galleryBtn" href="gallery.html" title="The gallery wall" aria-label="Visit the gallery wall">
      <svg viewBox="0 0 24 24"><path d="M3 5h18v14H3zM3 15l5-5 4 4 3-3 6 6M15 9h.01"/></svg>
    </a>
    <button id="exportBtn" title="Save or pin a picture" aria-label="Save or pin a picture">
      <svg viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 15v5h16v-5"/></svg>
    </button>
    <button id="resetBtn" title="Start fresh" aria-label="Start fresh">
      <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v5h5"/></svg>
    </button>
  </div>

  <nav class="pocket" aria-label="Painting tools">
    <div class="group" id="tools">
      <button data-tool="pencil" title="Pencil (B)" aria-label="Pencil"><svg viewBox="0 0 24 24"><path d="m15 4 5 5L9 20H4v-5zM13 6l5 5"/></svg></button>
      <button data-tool="fill" title="Paint tin: fill a closed shape (F)" aria-label="Paint tin" hidden><svg viewBox="0 0 24 24"><path d="m4 11 7-7 8 8-7 7zM4 11h15M20 15s2 2.5 2 3.7a2 2 0 0 1-4 0c0-1.2 2-3.7 2-3.7"/></svg></button>
      <button data-tool="eraser" title="Eraser (E)" aria-label="Eraser"><svg viewBox="0 0 24 24"><path d="m4 14 9-10 7 7-9 10H8zM9 9l7 7M12 21h9"/></svg></button>
    </div>
    <div class="group" id="palette" aria-label="Your colours"></div>
    <div class="group" id="patterns" aria-label="Fill patterns" hidden></div>
    <div class="group" id="mods" aria-label="Magic" hidden></div>
    <div class="group">
      <button id="sizeBtn" title="Line size (S)" aria-label="Line size"><span id="sizeDot"></span></button>
      <button id="moveBtn" title="Move around (H, or hold space)" aria-label="Move around" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M8 13V5c0-2 3-2 3 0v6-8c0-2 3-2 3 0v8-6c0-2 3-2 3 0v7-4c0-2 3-2 3 0v8c0 6-8 8-11 4l-6-7c-1-2 1-3 3-1l2 2"/></svg></button>
    </div>
    <div class="group">
      <button id="undoBtn" title="Undo (Ctrl Z)" aria-label="Undo"><svg viewBox="0 0 24 24"><path d="M9 7 4 12l5 5M4 12h11a5 5 0 0 1 0 10h-3"/></svg></button>
      <button id="redoBtn" title="Redo (Ctrl Shift Z)" aria-label="Redo"><svg viewBox="0 0 24 24"><path d="m15 7 5 5-5 5M20 12H9a5 5 0 0 0 0 10h3"/></svg></button>
    </div>
  </nav>

  <button id="homeBtn" title="Back to Paper Street" aria-label="Back to Paper Street"><svg viewBox="0 0 24 24"><path d="m3 11 9-8 9 8M6 9v12h12V9M10 21v-7h4v7"/></svg></button>

  <div id="bubble" hidden><span id="bubbleName"></span><p id="bubbleText"></p></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="loading" aria-hidden="true">unfolding…</div>

  <dialog id="journal">
    <button class="close" data-close aria-label="Close credits">×</button>
    <h2>Credits</h2>
    <div id="journalBody"></div>
  </dialog>

  <dialog id="exportDialog">
    <button class="close" data-close aria-label="Close">×</button>
    <h2>Keep this view</h2>
    <p class="sub">Exactly what is on your screen right now.</p>
    <form id="pinForm" class="pin-form">
      <label>Title <input id="pinTitle" maxlength="60" placeholder="Untitled" autocomplete="off"></label>
      <label>Your name <input id="pinAuthor" maxlength="40" placeholder="Someone" autocomplete="nickname"></label>
      <div class="row">
        <button type="submit" id="pinBtn" class="solid">Pin it to the gallery wall</button>
        <button type="button" id="downloadBtn">Download PNG</button>
      </div>
    </form>
    <p id="exportStatus" role="status"></p>
  </dialog>

  <dialog id="resetDialog">
    <h2>A clean sheet?</h2>
    <p>This deletes your painting and everything you have found in this browser.</p>
    <div class="row"><button data-close>Keep painting</button><button id="confirmReset" class="solid">Start fresh</button></div>
  </dialog>

  <script type="module" src="js/main.js"></script>
</body>
</html>
