<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#f8f7f2">
  <title>Endless Canvas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="world" tabindex="0" aria-label="Little Margin, a paper town to draw in. Draw with one finger, mouse or pen. Move with two fingers, the hand tool, space, or scrolling."></canvas>

  <header id="place" aria-live="polite"><span id="placeName"></span></header>

  <div class="actions">
    <button id="ideaBtn" title="Somewhere to draw (I)" aria-label="Take me somewhere to draw">
      <svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>
    </button>
    <a id="galleryBtn" href="gallery.html" title="The gallery wall" aria-label="Visit the gallery wall">
      <svg viewBox="0 0 24 24"><path d="M3 5h18v14H3zM3 15l5-5 4 4 3-3 6 6M15 9h.01"/></svg>
    </a>
    <button id="exportBtn" title="Save or pin a picture" aria-label="Save or pin a picture">
      <svg viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 15v5h16v-5"/></svg>
    </button>
    <button id="creditsBtn" title="Credits" aria-label="Credits">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>
    </button>
  </div>

  <nav class="dock" id="dock" aria-label="Drawing tools">
    <div class="group" id="tools">
      <button data-tool="pencil" title="Pencil (B)" aria-label="Pencil"><svg viewBox="0 0 24 24"><path d="m15 4 5 5L9 20H4v-5zM13 6l5 5"/></svg></button>
      <button data-tool="eraser" title="Eraser (E)" aria-label="Eraser"><svg viewBox="0 0 24 24"><path d="m4 14 9-10 7 7-9 10H8zM9 9l7 7M12 21h9"/></svg></button>
    </div>
    <div class="group colours">
      <div id="palette" aria-label="Your colours"></div>
      <button id="dishBtn" title="Mixing dish (X)" aria-label="Mixing dish" hidden><svg viewBox="0 0 24 24"><path d="M3 11h18c0 4.5-4 8-9 8s-9-3.5-9-8z"/><circle cx="7.5" cy="7" r="1.6"/><circle cx="12" cy="5" r="1.6"/><circle cx="16.5" cy="7" r="1.6"/></svg></button>
      <button id="colourBtn" data-tray="colour" title="Colours (C)" aria-label="Colours" aria-expanded="false"><span id="colourDot"></span></button>
    </div>
    <div class="group">
      <button id="sizeBtn" title="Line size (S)" aria-label="Line size"><span id="sizeDot"></span></button>
      <button id="magicBtn" data-tray="magic" title="Magic (Q)" aria-label="Magic" aria-expanded="false" hidden><svg viewBox="0 0 24 24"><path d="m5 19 9-9M14 5l1 2 2 1-2 1-1 2-1-2-2-1 2-1zM19 11l.6 1.4L21 13l-1.4.6L19 15l-.6-1.4L17 13l1.4-.6zM8 3l.6 1.4L10 5l-1.4.6L8 7l-.6-1.4L6 5l1.4-.6z"/></svg></button>
    </div>
    <div class="group">
      <button id="moveBtn" title="Move around (H, or hold space)" aria-label="Move around" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M8 13V5c0-2 3-2 3 0v6-8c0-2 3-2 3 0v8-6c0-2 3-2 3 0v7-4c0-2 3-2 3 0v8c0 6-8 8-11 4l-6-7c-1-2 1-3 3-1l2 2"/></svg></button>
      <button id="undoBtn" title="Undo (Ctrl Z)" aria-label="Undo"><svg viewBox="0 0 24 24"><path d="M9 7 4 12l5 5M4 12h11a5 5 0 0 1 0 10h-3"/></svg></button>
      <button id="redoBtn" title="Redo (Ctrl Shift Z)" aria-label="Redo"><svg viewBox="0 0 24 24"><path d="m15 7 5 5-5 5M20 12H9a5 5 0 0 0 0 10h3"/></svg></button>
    </div>
  </nav>
  <div id="tray" class="tray" hidden><div id="trayBody"></div></div>

  <button id="homeBtn" title="Paper Street" aria-label="Back to Paper Street"><svg viewBox="0 0 24 24"><path d="m3 11 9-8 9 8M6 9v12h12V9M10 21v-7h4v7"/></svg></button>

  <div id="bubble" hidden><span id="bubbleName"></span><p id="bubbleText"></p></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="loading" aria-hidden="true">unfolding…</div>

  <dialog id="creditsDialog">
    <button class="close" data-close aria-label="Close">×</button>
    <h2>Credits</h2>
    <p class="sub">The photographs are public domain or CC0. Thank you to the collections that share them.</p>
    <ul id="creditList" class="credits"></ul>
    <button id="startAgain" class="quiet-link">Start again from the midnight train…</button>
  </dialog>

  <dialog id="exportDialog">
    <button class="close" data-close aria-label="Close">×</button>
    <h2>Keep this view</h2>
    <form id="pinForm" class="pin-form">
      <label>Title <input id="pinTitle" maxlength="60" placeholder="Untitled" autocomplete="off"></label>
      <label>Your name <input id="pinAuthor" maxlength="40" placeholder="Someone" autocomplete="nickname"></label>
      <div class="row">
        <button type="submit" id="pinBtn" class="solid">Pin it to the gallery wall</button>
        <button type="button" id="downloadBtn">Download PNG</button>
      </div>
    </form>
    <p id="exportStatus" role="status"></p>
  </dialog>

  <dialog id="dishDialog">
    <button class="close" data-close aria-label="Close">×</button>
    <h2>Mixing dish</h2>
    <div id="recipes"></div>
  </dialog>

  <dialog id="wordDialog">
    <h2>What is it?</h2>
    <p class="sub" id="wordLine"></p>
    <form id="wordForm" class="pin-form">
      <input id="wordInput" maxlength="30" placeholder="a dragon, a teapot, my aunt…" autocomplete="off" aria-label="What you drew">
      <div class="row"><button type="submit" class="solid">Go on</button><button type="button" data-close>Skip</button></div>
    </form>
  </dialog>

  <dialog id="resetDialog">
    <h2>A clean sheet?</h2>
    <p>This deletes your drawings and the town’s story in this browser.</p>
    <div class="row"><button data-close>Keep drawing</button><button id="confirmReset" class="solid">Start again</button></div>
  </dialog>

  <script type="module" src="js/main.js"></script>
</body>
</html>
