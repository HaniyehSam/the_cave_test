<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f7f2"><title>Somewhere</title><link rel="stylesheet" href="style.css"></head>
<body>
<canvas id="world" aria-label="An open drawing world. Collect the brush and paint jars. Draw with one finger or a pen, move with two fingers, middle mouse or scroll." tabindex="0"></canvas>
<div class="actions"><button id="reset" title="Start fresh" aria-label="Start fresh">↻</button><button id="export" title="Save a picture" aria-label="Save a picture"><svg viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 15v5h16v-5"/></svg></button></div>
<div id="loading" role="status" aria-live="polite"></div>
<nav class="pocket" aria-label="Drawing tools">
 <div class="tools"><button id="draw" title="Draw (B)" aria-label="Draw" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="m15 3 5 4-9 10-4-3zM7 14c-6 0 0 6-5 7 7 2 10-2 9-4"/></svg></button><button id="move" title="Move (H). Two fingers, middle mouse or scroll always move." aria-label="Move" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M8 13V5c0-2 3-2 3 0v6-8c0-2 3-2 3 0v8-6c0-2 3-2 3 0v7-4c0-2 3-2 3 0v8c0 6-8 8-11 4l-6-7c-1-2 1-3 3-1l2 2"/></svg></button></div>
 <div id="palette" aria-label="Collected colors"></div>
 <div class="tools paint-tools" hidden><button id="size" title="Brush size" aria-label="Brush size"><span id="sizeDot"></span></button><button id="fill" title="Fill an outlined shape (F)" aria-label="Fill an outlined shape" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="m3 12 9-9 9 9-9 9zM4 12h16M9 3l6 6"/></svg></button><button id="erase" title="Eraser (E)" aria-label="Eraser" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="m4 13 10-10 7 7-10 10H7l-5-5zM8 9l7 7M12 20h9"/></svg></button></div>
 <div class="tools history"><button id="undo" title="Undo (Ctrl Z)" aria-label="Undo">↶</button><button id="redo" title="Redo (Ctrl Shift Z)" aria-label="Redo">↷</button></div>
</nav>
<button id="home" title="Back to the first street" aria-label="Back to the first street"><svg viewBox="0 0 24 24"><path d="m3 11 9-8 9 8M6 9v12h12V9M10 21v-7h4v7"/></svg></button>
<div id="status" role="status" aria-live="polite"></div>
<aside id="dialogue" hidden aria-label="Conversation"><button id="closeDialogue" aria-label="Close conversation">×</button><span id="speaker"></span><p id="dialogueText"></p><div id="dialogueChoices"></div></aside>
<dialog id="exportDialog"><button id="closeExport" class="close" aria-label="Close export">×</button><h2>Keep a little world.</h2><label for="exportArea">Save</label><select id="exportArea"><option value="view">What is on my screen</option><option value="explored">Everything I have explored</option></select><p id="exportInfo"></p><p class="export-note">Explored areas include your drawings, discoveries and conversations. Unvisited gaps stay blank.</p><button id="download">Download PNG ↗</button><p id="exportProgress" role="status" aria-live="polite"></p></dialog>
<dialog id="resetDialog"><h2>A clean sheet?</h2><p>Delete your drawing, collected colors and discoveries from this prototype?</p><div><button id="cancelReset">Keep exploring</button><button id="confirmReset">Start fresh</button></div></dialog>
<script src="app.js"></script>
</body></html>
